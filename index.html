<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PrintSketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,800&family=Oswald:wght@400;700&family=Bebas+Neue&family=Roboto+Slab:wght@400;800&family=Playfair+Display:ital,wght@0,400;0,800;1,400;1,800&family=Cinzel:wght@400;800&family=Fredoka:wght@400;700&family=Orbitron:wght@400;800&family=Black+Ops+One&family=Permanent+Marker&family=Pacifico&family=Dancing+Script:wght@400;700&family=Lobster&family=Press+Start+2P&family=Roboto:wght@400;700;900&family=Montserrat:wght@400;800&family=Poppins:wght@400;800&family=Anton&family=Archivo+Black&family=Russo+One&family=Bungee&family=Bangers&family=Luckiest+Guy&family=Titan+One&family=Righteous&family=Alfa+Slab+One&family=Abril+Fatface&family=Merriweather:wght@400;900&family=Special+Elite&family=Courier+Prime:wght@400;700&family=Great+Vibes&family=Satisfy&family=Caveat:wght@400;700&family=Comic+Neue:wght@400;700&family=Stardos+Stencil:wght@400;700&family=Audiowide&family=Creepster&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#16181D;color:#E8EAED;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #2A2F38}
.hleft{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:12px}
.hright{flex:none;margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:8px}
@media (max-width:1300px){.brand span{display:none}}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;white-space:nowrap}
nav{display:flex;gap:4px;background:#1F232A;padding:4px;border-radius:12px}
nav button{min-height:44px;padding:0 18px;border-radius:9px;border:0;background:transparent;color:#C9CED6;font-weight:500;font-size:15px;cursor:pointer}
nav button.on{background:#F5A04A;color:#16181D;font-weight:600}
.trashbtn{color:#F08A8A;padding:0 12px}
.trashbtn:disabled{opacity:.35;cursor:default}
.projbtn{height:44px;padding:0 14px;border-radius:10px;border:1px solid #3A404B;background:#1F232A;color:#E8EAED;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid #3A404B;background:#1F232A;color:#E8EAED;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:18px}
#body{flex:1;display:flex;min-height:0}
#rail{width:72px;flex:none;border-right:1px solid #2A2F38;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;overflow-y:auto}
#rail button{width:52px;min-height:52px;border-radius:12px;border:0;background:transparent;color:#C9CED6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;cursor:pointer;padding:4px 0}
#rail button.on{background:#F5A04A;color:#16181D}
#rail .sp{flex:1}
.liblist{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;margin:8px 0}
.libitem{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1E2229;border-radius:10px;padding:8px 10px}
.libitem .btns button{min-height:40px;padding:0 14px}
#stage{flex:1;position:relative;min-width:0;background:#20242B}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;pointer-events:none}
#hud>*{pointer-events:auto}
.hint{background:#16181D;color:#C9CED6;font-size:13px;padding:9px 15px;border-radius:999px;white-space:nowrap}
.hudbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:#16181D;padding:8px 14px 8px 8px;border-radius:14px;width:min(560px,92%)}
.hudbar input{flex:1}
.hudbar .val{min-width:130px;text-align:right;font-size:14px;font-weight:600;color:#F5A04A}
#pickers{display:flex;gap:8px;min-width:0;flex:1 1 auto}
#objpick,#platepick{display:flex;align-items:center;gap:8px;min-width:0}
#platepick{flex:0 1 auto}#objpick{flex:0 1 auto}
#platepick select{min-height:40px;max-width:210px;min-width:90px;width:auto;background:#252A33;border:1px solid #3A404B;font-size:14px}
#objpick select{min-height:40px;max-width:300px;min-width:90px;width:auto;background:#252A33;border:1px solid #3A404B;font-size:14px}
.objlbl{font-size:13px;color:#A7ADB7}
#vt{display:flex;background:#1F232A;border-radius:12px;padding:4px;gap:3px;flex:none}
#vt button{min-height:44px;min-width:52px;border:0;border-radius:8px;background:transparent;color:#C9CED6;font-weight:600;cursor:pointer}
#vt button.on{background:#3A404B;color:#fff}
#views{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;background:#16181D;border-radius:10px;padding:3px;gap:3px}
#views button{min-height:38px;min-width:70px;border:0;border-radius:8px;background:transparent;color:#C9CED6;font-weight:600;font-size:13px;cursor:pointer}
#views button:active{background:#3A404B}
#grip{width:12px;flex:none;cursor:col-resize;display:flex;align-items:center;justify-content:center;background:#16181D;border-left:1px solid #2A2F38;touch-action:none;position:relative}
#grip::before{content:'';width:4px;height:44px;border-radius:2px;background:#3A404B}
#grip:hover::before,#grip.drag::before{background:#F5A04A}
#gripBtn{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:28px;height:44px;border-radius:8px;border:1px solid #3A404B;background:#1F232A;color:#C9CED6;cursor:pointer;padding:0;font-size:14px;z-index:3}
#panel.hide{display:none}
#grip.closed{width:36px}#grip.closed::before{display:none}
#panel{width:340px;flex:none;border-left:1px solid #2A2F38;background:#1A1D23;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
#panel h2{margin:0;font-size:18px}
#panel h3{margin:0 0 6px;font-size:15px}
.sub{margin:-8px 0 0;font-size:13px;color:#A7ADB7;line-height:1.45}
.note{margin:0;font-size:12.5px;color:#A7ADB7;line-height:1.45}
.warn{margin:0;font-size:13px;line-height:1.45;color:#FFD9B0;background:#4A2A14;border-radius:10px;padding:10px 12px}
.tips{margin:0;padding-left:18px;font-size:13px;color:#C9CED6;line-height:1.7}
.field{display:flex;flex-direction:column;gap:7px}
.lbl{font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center}
.val{color:#F5A04A;font-weight:600;font-size:14px}
.stepper{display:flex;gap:6px;align-items:stretch}
.sq{width:44px;min-width:44px;height:44px;border-radius:10px;border:1px solid #3A404B;background:#1F232A;color:#E8EAED;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sq.dark{background:#252A33;border-color:#3A404B;font-size:15px}
.num{flex:1;min-width:0;height:44px;border-radius:10px;background:#252A33;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px}
.num input{width:100%;min-width:0;background:transparent;border:0;text-align:right;font-weight:600;font-size:16px;outline:none}
.num span{font-size:12px;color:#A7ADB7;white-space:nowrap;flex:none}
.num:focus-within{outline:2px solid #F5A04A}
.seg{display:grid;gap:4px;background:#252A33;padding:4px;border-radius:10px}
.seg button{min-height:42px;border-radius:8px;border:0;background:transparent;color:#C9CED6;font-weight:500;font-size:14px;cursor:pointer;line-height:1.2;padding:4px 2px}
.seg button small{font-size:11px;color:inherit;opacity:.8}
.seg button.on{background:#3A404B;color:#fff;font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{min-width:52px;height:44px;border-radius:10px;border:2px solid #3A404B;background:#252A33;color:#E8EAED;display:flex;align-items:center;gap:6px;padding:0 8px;cursor:pointer;font-weight:600;font-size:13px}
.sw span{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.sw.on{border-color:#F5A04A;background:#3A404B}
.linkbtn{background:none;border:0;color:#F5A04A;font-weight:600;font-size:13px;cursor:pointer;min-height:32px;padding:0 4px}
.ctypes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ctype{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;border-radius:12px;border:2px solid #3A404B;background:#252A33;color:#E8EAED;cursor:pointer;min-height:84px}
.ctype span{font-size:12.5px;color:#A7ADB7;line-height:1.35}
.ctype.on{border-color:#F5A04A}
.fontprev{margin:2px 0 4px;padding:8px 12px;border-radius:10px;background:#F4F1EA;color:#16181D;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>button{flex:1}
button.primary{min-height:52px;border-radius:12px;border:0;background:#F5A04A;color:#16181D;font-weight:700;font-size:16px;cursor:pointer;padding:0 14px}
button.ghost{min-height:46px;border-radius:12px;border:1px solid #3A404B;background:#1F232A;color:#E8EAED;font-weight:600;font-size:14px;cursor:pointer;padding:0 12px}
button.danger{min-height:46px;border-radius:12px;border:1px solid #6B2D2D;background:transparent;color:#FFB4B4;font-weight:600;font-size:14px;cursor:pointer;padding:0 12px}
button.small{flex:0 0 auto !important;min-width:64px}
.savebar{display:flex;gap:8px}.savebar .primary{flex:1}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:14px;cursor:pointer}
.toggle input{width:24px;height:24px;accent-color:#F5A04A}
input[type=range]{width:100%;accent-color:#F5A04A;height:28px}
select,.txt{width:100%;min-height:46px;border-radius:10px;border:1px solid #3A404B;background:#252A33;padding:0 12px;font-size:15px}
.color{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.color input{width:44px;height:36px;border:0;background:none;padding:0}
textarea.txt{width:100%;resize:vertical;min-height:84px;font:inherit;line-height:1.4;padding:10px 12px}
.box{background:#20242B;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box.sec>h3:first-child{cursor:pointer;display:flex;align-items:center;gap:8px;margin:0;min-height:32px;user-select:none;-webkit-tap-highlight-color:transparent}
.box.sec>h3:first-child::after{content:'';margin-left:auto;width:9px;height:9px;border-right:2px solid #9AA0AA;border-bottom:2px solid #9AA0AA;transform:rotate(45deg);transition:transform .15s;flex:none}
.box.sec.shut>h3:first-child::after{transform:rotate(-45deg)}
.box.sec.shut{gap:0;padding-top:8px;padding-bottom:8px}
.box.sec.shut>:not(:first-child){display:none}
#toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);background:#E8EAED;color:#16181D;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;max-width:min(560px,92vw);transition:transform .25s;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#modal.show{display:flex}
.dialog{background:#1F232A;border-radius:16px;padding:22px;max-width:480px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.55}
.dialog h2{margin:0}.dialog p{margin:0}
@media (max-width:900px){
  #body{flex-direction:column}
  #rail{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid #2A2F38;padding:6px;overflow-x:auto}
  #rail .sp{display:none}
  #stage{min-height:52vh}
  #panel{width:auto;border-left:0;border-top:1px solid #2A2F38;max-height:40vh}
  .brand span{display:none}
  .projbtn span{display:none}
  nav button{padding:0 12px}
}
</style>

<body>
<div id="app">
  <header>
    <div class="hleft"><div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F5A04A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M4 7.5l8 4.5 8-4.5M12 12v9"></path></svg><span>PrintSketch</span></div><div id="pickers"><div id="platepick" style="display:none"></div><div id="objpick" style="display:none"></div></div><div id="vt"><button id="vt2" data-act="v2" class="on">2D</button><button id="vt3" data-act="v3">3D</button></div></div>

  </header>
  <div id="body">
    <div id="rail" role="toolbar" aria-label="Drawing tools">
      <button data-tool="pen" class="on" aria-label="Pen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg>Pen</button>
      <button data-tool="line" aria-label="Straight lines"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19L9 6l6 9 5-10"></path></svg>Lines</button>

      <button data-tool="circle" aria-label="Circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg>Circle</button>
      <button data-tool="select" aria-label="Select and move"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 8-6 2-3 6z"></path></svg>Select</button>
      <button data-tool="text" aria-label="Add 3D text"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"></path></svg>Text</button>
      <button data-tool="photo" aria-label="Trace a photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>Photo</button>
      <button data-tool="import" aria-label="Import STL or 3MF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 8v7M9 12l3 3 3-3"></path></svg>Import</button>
      <button data-tool="multi" aria-label="Multi-select: tap objects to add them"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="11" height="11" rx="1"></rect><rect x="10" y="10" width="11" height="11" rx="1"></rect></svg>Multi</button>
      <button data-tool="measure" aria-label="Measure a distance"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17L17 3l4 4L7 21z"></path><path d="M7 13l2 2M10 10l2 2M13 7l2 2"></path></svg>Measure</button>
      <div class="sp"></div>
      <button data-tool="fit" aria-label="Fit view"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>Fit</button>
      <button data-tool="undo" aria-label="Undo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 010 10h-3"></path></svg>Undo</button>
      <button data-tool="redo" aria-label="Redo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 000 10h3"></path></svg>Redo</button>
    </div>
    <div id="stage">
      <canvas id="c2"></canvas>
      <canvas id="c3" style="display:none"></canvas>
      <div id="views" style="display:none" aria-label="Camera"><button data-act="cam-top">Top</button><button data-act="cam-front">Front</button><button data-act="cam-side">Side</button><button data-act="cam-bottom">Bottom</button></div>
      <div id="hud"></div>
      <div id="busy" style="display:none;position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#16181D;color:#F5A04A;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;pointer-events:none;z-index:4">Updating…</div>
    </div>
    <div id="grip" role="separator" aria-orientation="vertical" aria-label="Drag to resize the panel" title="Drag to resize · double-click to reset"><button id="gripBtn" aria-label="Hide the panel" title="Hide or show the panel">›</button></div>
    <aside id="panel" aria-label="Settings"></aside>
  </div>
</div>

<script>
/* PrintSketch geometry core: polygons, triangulation, solids, exporters. Units: mm. */
var G = (function () {
  'use strict';

  /* ---------------- earcut (polygon triangulation with holes) ---------------- */
  function Node(i, x, y) { this.i = i; this.x = x; this.y = y; this.prev = null; this.next = null; this.steiner = false; }
  function earcut(data, holeIndices) {
    var dim = 2;
    var hasHoles = holeIndices && holeIndices.length;
    var outerLen = hasHoles ? holeIndices[0] * dim : data.length;
    var outerNode = linkedList(data, 0, outerLen, dim, true);
    var triangles = [];
    if (!outerNode || outerNode.next === outerNode.prev) return triangles;
    if (hasHoles) outerNode = eliminateHoles(data, holeIndices, outerNode, dim);
    earcutLinked(outerNode, triangles, dim, 0);
    return triangles;
  }
  function linkedList(data, start, end, dim, clockwise) {
    var i, last;
    if (clockwise === (signedArea(data, start, end, dim) > 0)) {
      for (i = start; i < end; i += dim) last = insertNode(i, data[i], data[i + 1], last);
    } else {
      for (i = end - dim; i >= start; i -= dim) last = insertNode(i, data[i], data[i + 1], last);
    }
    if (last && equals(last, last.next)) { removeNode(last); last = last.next; }
    return last;
  }
  function filterPoints(start, end) {
    if (!start) return start;
    if (!end) end = start;
    var p = start, again;
    do {
      again = false;
      if (!p.steiner && (equals(p, p.next) || area(p.prev, p, p.next) === 0)) {
        removeNode(p);
        p = end = p.prev;
        if (p === p.next) break;

    toast('Opened ' + (d.name || 'project') + ' (' + S.shapes.length + ' object' + (S.shapes.length === 1 ? '' : 's') + ').', 4000);
  }
  function openProjectFile(file) {
    file.text().then(function (t) { loadProject(JSON.parse(t)); }).catch(function (err) { toast('Could not open that project: ' + (err && err.message ? err.message : err), 6000); });
  }
  function projectMenu() {
    var m = $('#modal');
    m.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pjt"><h2 id="pjt">Project</h2>' +
      '<p class="note">A project file keeps all your objects, names, holes and settings so you can open them again later or on another device.</p>' +
      '<div class="field"><label class="lbl" for="pjname">Project name</label><input type="text" id="pjname" class="txt" maxlength="40" value="' + esc(S.projectName || 'my-project') + '" autocomplete="off"></div>' +
      '<div class="btns"><button class="primary" id="pjSave">Save project</button></div>' +
      '<div class="btns"><button class="ghost" id="pjLib">My parts…</button></div>' +
      '<div class="btns"><button class="ghost" id="pjOpen">Open project…</button><button class="danger" id="pjNew">New project</button></div>' +
      '<div class="btns"><button class="ghost" id="pjClose">Close</button></div></div>';
    m.classList.add('show');
    var nameIn = $('#pjname');
    nameIn.addEventListener('input', function () { S.projectName = nameIn.value.trim(); persist(); });
    $('#pjSave').onclick = function () { S.projectName = nameIn.value.trim() || 'my-project'; m.classList.remove('show'); saveProject(); };
    $('#pjOpen').onclick = function () {
      m.classList.remove('show');
      var go = function () { $('#fileProj').click(); };
      if (S.shapes.length) confirmBox('Opening a project replaces what is on screen now. Save your current work first if you want to keep it.', go, 'Open anyway'); else go();
    };
    $('#pjNew').onclick = function () {
      m.classList.remove('show');
      confirmBox('Start a new, empty project? What is on screen now will be cleared.', function () {
        snapshot(); S.shapes = []; S.sel = null; traceSess = null; S.projectName = 'my-project'; changed(true);
      }, 'Start new');
    };
    $('#pjClose').onclick = function () { m.classList.remove('show'); };
    $('#pjLib').onclick = function () { m.classList.remove('show'); libraryDialog(); };
  }
  $('#projBtn').addEventListener('click', projectMenu);
  $('#fileProj').addEventListener('change', function (e) { var f = e.target.files[0]; if (f) openProjectFile(f); e.target.value = ''; });
  $('#helpBtn').addEventListener('click', function () {
    var m = $('#modal');
    m.innerHTML = '<div class="dialog" role="dialog" aria-modal="true"><h2>How it works</h2><p class="note">PrintSketch version ' + VERSION + '</p>' +
      '<p><b>Draw</b>: sketch outlines with the S Pen, or use lines, rectangles and circles. Mark a shape as <i>a hole</i> to cut it out of the shape around it. <b>Photo</b> traces a picture or a pencil sketch. <b>Import</b> opens a .stl or .3mf so you can resize it, add to it, or cut holes into it. Drag the white squares around a selected shape to resize it.</p>' +
      '<p><b>3D view</b>: tap a shape to select it. Drag the red, green or blue arrows to move it, the small cubes to stretch it (the yellow corner cube resizes everything evenly), and the orange ring to turn it. Drag empty space to look around. Red see-through shapes are holes.</p>' +
      '<p><b>Inlay</b>: puts text or one of your drawings into a flat part in a second color. To put an inlay on any face of an object, select the object and tap <i>Add inlay to a surface</i>, then tap the spot in 3D.</p>' +
      '<p><b>Several at once</b>: shift+click, or turn on <i>Multi</i> in the toolbar and tap objects. Resize, move, turn, color or delete them together, or tap <i>Group them</i> so they always move as one.</p>' +
      '<p><b>Cut</b>: select an object and tap <i>Cut this object</i> to slice it flat across or straight down, keeping one or both pieces.</p>' +
      '<p><b>Connect</b>: select an object and tap <i>Connect to another object</i> to join two objects with a hinge, a dovetail slide, alignment pegs or magnet pockets.</p>' +
      '<p><b>Project</b> (top right) saves everything you have made to a file, and opens it again later.</p>' +
      '<p><b>Getting it to Bambu Studio</b>: tap Save, send the file to your PC (Google Drive, email or USB), unzip it, and open the .3mf.</p>' +
      '<div class="btns"><button class="primary" id="mNo">Got it</button></div></div>';
    m.classList.add('show'); $('#mNo').onclick = function () { m.classList.remove('show'); };
  });

  /* ---------------- start ---------------- */
  load();
  (function () {
    var big = null; try { big = localStorage.getItem('printsketch-big'); } catch (e) { }
    if (!big) return;
    toast('Opening your last work…', 3000);
    idbGet().then(function (rec) {
      if (!rec || !rec.data) return;
      applySaved(JSON.parse(rec.data)); S.sel = null; S.multi = [];
      gmCache.clear(); renderPanel(); size2d(); if (GS().length) fit2d(G.bbox(GS().map(outline))); render2d(); update3dIfNeeded(false);
      toast('Your last work is back.', 2500);
    }).catch(function () { });
  })();
  window.addEventListener('resize', function () { size2d(); render2d(); if (viewer.ok) viewer.draw(); });
  loadMyFonts().then(function (l) { if (l.length) { Object.keys(textCache).forEach(function (k) { delete textCache[k]; }); gmCache.clear(); renderPanel(); render2d(); update3dIfNeeded(); } });
  /* ---------------- resizable / hideable side panel ---------------- */
  (function () {
    var panel = $('#panel'), grip = $('#grip'), btn = $('#gripBtn'), PW = 340, hidden = false;
    try { PW = +localStorage.getItem('printsketch-panelw') || 340; hidden = localStorage.getItem('printsketch-panelhide') === '1'; } catch (e) { }
    function relayout() { size2d(); render2d(); if (viewer.ok) viewer.draw(); }
    function apply() {
      var maxW = Math.max(260, Math.min(720, window.innerWidth - 480));
      PW = Math.max(260, Math.min(maxW, PW));
      panel.style.width = PW + 'px'; panel.classList.toggle('hide', hidden);
      btn.textContent = hidden ? '\u2039' : '\u203A'; btn.setAttribute('aria-label', hidden ? 'Show the panel' : 'Hide the panel');
      grip.style.cursor = hidden ? 'default' : 'col-resize'; grip.classList.toggle('closed', hidden);
    }
    function save() { try { localStorage.setItem('printsketch-panelw', PW); localStorage.setItem('printsketch-panelhide', hidden ? '1' : '0'); } catch (e) { } }
    apply();
    btn.addEventListener('click', function (e) { e.stopPropagation(); hidden = !hidden; apply(); save(); relayout(); });
    btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    var drag = null;
    grip.addEventListener('pointerdown', function (e) { if (hidden) return; drag = { x: e.clientX, w: PW }; grip.setPointerCapture(e.pointerId); grip.classList.add('drag'); e.preventDefault(); });
    grip.addEventListener('pointermove', function (e) { if (!drag) return; PW = drag.w + (drag.x - e.clientX); apply(); relayout(); });
    function end() { if (!drag) return; drag = null; grip.classList.remove('drag'); save(); }
    grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
    grip.addEventListener('dblclick', function () { if (hidden) return; PW = 340; apply(); save(); relayout(); });
    window.addEventListener('resize', apply);
  })();
  renderPanel();
  requestAnimationFrame(function () { size2d(); if (GS().length) fit2d(G.bbox(GS().map(outline))); render2d(); });
  if (!viewer.ok) toast('3D preview is not available on this device. Drawing and saving still work.', 6000);
  window.__toS = toS; window.__inlayRegs = function () { return inlayRegions(); }; window.__viewer = viewer; window.__ps = { S: S, G: G, render2d: render2d, update3d: update3d, inlayMeshes: inlayMeshes, buildHinge: buildHinge, drawPartMesh: drawPartMesh, drawParts: drawParts, addShape: addShape, changed: changed, partGroups: function () { return partGroups(); }, cutList: function (g) { return cutList(g); }, shapesJson: function () { return shapesJson(); }, writeStore: function () { writeStore(); } };
})();

</script>
<script>
/* Installed-app extras: offline service worker, font caching, Install button. */
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      // look for a new version whenever the app comes back to the front
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () { }); });
      return navigator.serviceWorker.ready;
    }).then(function () {
      // Fetch every font once while online so the service worker keeps them for offline use.
      if (!navigator.onLine || !document.fonts || localStorage.getItem('ps-fonts-cached') === '1') return;
      var waits = [];
      document.fonts.forEach(function (f) {
        var r = f.unicodeRange || '';
        if (r === '' || /U\+0-(FF|10FFFF)\b|U\+0000-00FF/i.test(r)) waits.push(f.load().catch(function () { }));
      });
      Promise.all(waits).then(function () { try { localStorage.setItem('ps-fonts-cached', '1'); } catch (e) { } });
    }).catch(function () { });
  });

  // a new version took over in the background: offer to switch to it
  var hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController) { hadController = true; return; }
    if (document.getElementById('updBar')) return;
    var bar = document.createElement('div');
    bar.id = 'updBar';
    bar.setAttribute('role', 'status');
    bar.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9999;background:#16181D;color:#fff;border:1px solid #3A404B;border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font:600 15px Inter,system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.4)';
    bar.innerHTML = '<span>A new version of PrintSketch is ready.</span><button style="min-height:40px;padding:0 16px;border:0;border-radius:8px;background:#F5A04A;color:#16181D;font-weight:700;cursor:pointer">Update now</button>';
    bar.querySelector('button').onclick = function () { location.reload(); };
    document.body.appendChild(bar);
  });
  var deferred = null;
  function installBtn() {
    var b = document.getElementById('installBtn');
    if (b) return b;
    var host = document.getElementById('projBtn');
    if (!host) return null;
    b = document.createElement('button');
    b.id = 'installBtn'; b.className = 'projbtn'; b.type = 'button';
    b.setAttribute('aria-label', 'Install PrintSketch as an app');
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg><span>Install</span>';
    host.parentNode.insertBefore(b, host);
    b.addEventListener('click', function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; b.remove(); });
    });
    return b;
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; installBtn(); });
  window.addEventListener('appinstalled', function () { var b = document.getElementById('installBtn'); if (b) b.remove(); });
})();
</script>
